<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVGK — Professional Video Showcase</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #00AA5B;
      --primary-hover: #008F4C;
      --primary-light: #E6F7EF;
      --bg-page: #F7F9F8;
      --bg-surface: #FFFFFF;
      --text-main: #202522;
      --text-muted: #747D77;
      --border-color: #E7ECE8;
      --border-focus: #00AA5B;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      background: var(--bg-page);
    }

    .brand span {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-grid {
      width: 100%;
      max-width: 760px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .thumb-card {
      width: 100%;
      background-color: var(--bg-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      position: relative;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
    }

    .grid-number-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .thumb-image-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      position: relative;
      background: var(--bg-page);
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-caption {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-page);
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .download-btn {
      width: 100%;
      padding: 10px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-sm);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
    }

    .download-btn:hover {
      background: var(--primary-hover);
    }

    .timer-spinner-container {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-svg {
      animation: rotate 1.5s linear infinite;
      width: 100%;
      height: 100%;
    }

    .spinner-svg circle {
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 3.5;
    }

    .spinner-svg circle.path {
      stroke: #FFFFFF;
      stroke-dasharray: 80;
      stroke-dashoffset: 60;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .countdown-number {
      position: absolute;
      font-size: 0.7rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .separator-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      margin: 16px 0 32px 0;
    }

    .separator-line {
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .separator-text {
      padding: 0 18px;
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2000;
    }

    .toast {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      font-weight: 600;
      animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .toast i { color: var(--primary); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      to { transform: translateX(100%); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="brand">
        <img src="pvgk.png" alt="PVGK Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/36/00AA5B/FFFFFF?text=P';">
        <span>PVGK</span>
      </a>
    </div>
  </header>

  <main>
    <div class="hero-grid" id="gridContainer">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
        <p style="margin-top: 10px; font-weight: 600;">Memuat konten video...</p>
      </div>
    </div>

    <div class="separator-container">
      <div class="separator-line"></div>
      <span class="separator-text">list video</span>
      <div class="separator-line"></div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const SUPABASE_URL = 'https://xnbntgxciqvhfzalazeb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuYm50Z3hjaXF2aGZ6YWxhemViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDY1NTAsImV4cCI6MjEwNzcyMjU1MH0.6nP2k8ggFBwLhQRTyTv80y7cDp57_4OblsrpjN1eoko';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const gridContainer = document.getElementById('gridContainer');
    const toastContainer = document.getElementById('toastContainer');

    async function loadUserGrids() {
      const { data: grids, error } = await supabase
        .from('grids')
        .select('*')
        .order('created_at', { ascending: true });

      if (error || !grids || grids.length === 0) {
        gridContainer.innerHTML = `
          <div class="thumb-card">
            <div class="thumb-image-wrapper">
              <img src="pvgk01.png" alt="Default Thumbnail" onerror="this.src='https://picsum.photos/1280/720'">
            </div>
            <div class="card-content">
              <p class="card-caption">Belum ada konten video tersedia saat ini.</p>
            </div>
          </div>
        `;
        return;
      }

      gridContainer.innerHTML = '';
      grids.forEach((grid, index) => {
        const gridNumber = index + 1;
        let extraLinks = Array.isArray(grid.extra_links) ? grid.extra_links : [];

        let linksHtml = `
          <div class="link-item">
            <button class="download-btn" onclick="handleDownload(this, '${escapeHtml(grid.target_url)}')">
              <i class="fa-solid fa-download"></i> Download Link Utama
            </button>
          </div>
        `;

        extraLinks.forEach((link, lIndex) => {
          linksHtml += `
            <div class="link-item" style="margin-top: 8px;">
              <button class="download-btn" onclick="handleDownload(this, '${escapeHtml(link.url)}')">
                <i class="fa-solid fa-link"></i> ${escapeHtml(link.label || 'Link ' + (lIndex + 2))}
              </button>
            </div>
          `;
        });

        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.innerHTML = `
          <div class="grid-number-badge">Grid #${gridNumber}</div>
          <div class="thumb-image-wrapper">
            <img src="${escapeHtml(grid.thumbnail_url)}" alt="Thumbnail Grid #${gridNumber}" onerror="this.src='https://picsum.photos/1280/720'">
          </div>
          <div class="card-content">
            ${grid.caption ? `<p class="card-caption">${escapeHtml(grid.caption)}</p>` : ''}
            <div class="links-section">
              ${linksHtml}
            </div>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    function handleDownload(btnElement, targetUrl) {
      btnElement.disabled = true;
      showToast('Kamu akan membuat link dulu, harap tunggu...', 'fa-circle-info');

      setTimeout(() => {
        let countdown = 15;
        const originalContent = btnElement.innerHTML;
        
        btnElement.innerHTML = `
          <div class="timer-spinner-container">
            <svg class="spinner-svg" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="14" fill="none"></circle>
              <circle cx="18" cy="18" r="14" fill="none" class="path"></circle>
            </svg>
            <span class="countdown-number" id="countdown-val">${countdown}</span>
          </div>
        `;

        const countdownValEl = btnElement.querySelector('#countdown-val');
        const interval = setInterval(() => {
          countdown--;
          if (countdownValEl) countdownValEl.textContent = countdown;

          if (countdown <= 0) {
            clearInterval(interval);
            showToast('Mengarahkan ke link tujuan...', 'fa-circle-check');
            setTimeout(() => {
              window.open(targetUrl, '_blank');
              btnElement.disabled = false;
              btnElement.innerHTML = originalContent;
            }, 500);
          }
        }, 1000);
      }, 3000);
    }

    function showToast(message, iconClass = 'fa-circle-info') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s cubic-bezier(0.4, 0, 1, 1) forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadUserGrids);
  </script>
</body>
</html>
